<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <rect width="1100" height="520" fill="#071526"/>
  <text x="550" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif">ZeroTier：加入同一虚拟交换机</text>
  <text x="550" y="70" text-anchor="middle" font-size="14" fill="#90caf9" font-family="Microsoft YaHei, PingFang SC, sans-serif">官方包只支持 ARM/ARM64。双方加入同一 Network ID 并授权。</text>
  
  <rect x="50" y="120" width="250" height="200" rx="16" fill="#0e4a55" stroke="#26c6da" stroke-width="2.5"/>
  <text x="175" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif">手机 App</text>
  <text x="175" y="178" text-anchor="middle" font-size="13" fill="#e8f4ff" font-family="Microsoft YaHei, PingFang SC, sans-serif">Network ID</text>
  
  <rect x="380" y="120" width="250" height="200" rx="16" fill="#5d1a12" stroke="#ff7043" stroke-width="2.5"/>
  <text x="505" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif">云端控制器</text>
  <text x="505" y="178" text-anchor="middle" font-size="13" fill="#e8f4ff" font-family="Microsoft YaHei, PingFang SC, sans-serif">Authorize 节点</text>
  
  <rect x="710" y="120" width="250" height="200" rx="16" fill="#1b4d2a" stroke="#66bb6a" stroke-width="2.5"/>
  <text x="835" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif">ARM 路由器</text>
  <text x="835" y="178" text-anchor="middle" font-size="13" fill="#e8f4ff" font-family="Microsoft YaHei, PingFang SC, sans-serif">zerotier1</text>
  <text x="835" y="198" text-anchor="middle" font-size="13" fill="#e8f4ff" font-family="Microsoft YaHei, PingFang SC, sans-serif">再放行防火墙</text>
  
  <defs>
    <marker id="ar1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#ffd54a"/>
    </marker>
  </defs>
  <line x1="300" y1="202" x2="380" y2="202" stroke="#ffd54a" stroke-width="3" marker-end="url(#ar1)"/>
  <circle cx="340" cy="180" r="11" fill="#ffd54a"/>
  <text x="340" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1200">1</text>
  <text x="340" y="212" text-anchor="middle" font-size="12" fill="#ffe082" font-family="Microsoft YaHei, PingFang SC, sans-serif">加入</text>
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#ffd54a"/>
    </marker>
  </defs>
  <line x1="630" y1="238" x2="710" y2="238" stroke="#ffd54a" stroke-width="3" marker-end="url(#ar2)"/>
  <circle cx="670" cy="216" r="11" fill="#ffd54a"/>
  <text x="670" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1200">2</text>
  <text x="670" y="248" text-anchor="middle" font-size="12" fill="#ffe082" font-family="Microsoft YaHei, PingFang SC, sans-serif">授权后互通</text>
  <text x="90" y="450" font-size="12" fill="#80deea">外网 / 远端</text>
  <text x="490" y="450" font-size="12" fill="#ffab91">MikroTik R1</text>
  <text x="860" y="450" font-size="12" fill="#a5d6a7">家里 / 内网</text>
  <rect x="0" y="484" width="1100" height="36" fill="#121212"/>
  <text x="550" y="508" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif">undefined</text>
