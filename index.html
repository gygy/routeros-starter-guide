<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RouterOS 入门实战</title>
  <meta name="description" content="MikroTik RouterOS 7.x 新手实战教程" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #c0392b;
    }
    .app-name-link img {
      max-height: 28px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="app">加载中…</div>
  <script>
    window.$docsify = {
      name: 'RouterOS 入门实战',
      repo: 'gygy/routeros-starter-guide',
      homepage: 'README.md',
      loadSidebar: false,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        placeholder: '搜索',
        noData: '没有结果',
        depth: 3
      },
      plugins: [
        function (hook) {
          // GitHub Markdown 的 ](<path with ()>) 转成 docsify 能认的链接
          hook.beforeEach(function (content) {
            return content.replace(/\]\(\<([^>]+)\>\)/g, ']($1)');
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
