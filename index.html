<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RouterOS 入门实战</title>
  <meta name="description" content="MikroTik RouterOS 7.x 新手实战教程 / Hands-on RouterOS 7.x starter guide" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root { --theme-color: #1e3a5f; }
    .lang-switch {
      position: fixed;
      right: 16px;
      top: 12px;
      z-index: 20;
      font-size: 13px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 4px 10px;
    }
    .lang-switch a { margin: 0 4px; color: #1e3a5f; text-decoration: none; }
    .lang-switch a.active { font-weight: 700; text-decoration: underline; }
    .sidebar { padding-top: 40px; }
    .markdown-section img { max-width: 100%; }
  </style>
</head>
<body>
  <div class="lang-switch">
    <a href="#/" id="lang-zh">中文</a> ·
    <a href="#/en/README" id="lang-en">English</a>
  </div>
  <div id="app">加载中…</div>
  <script>
    function fixMdLinks(content) {
      if (!content) return content;
      // GitHub angle-bracket links: ](<path with spaces/parens>)
      content = content.replace(/\]\(\<([^>]+)\>\)/g, function (_, p) {
        return '](' + encodeURI(p.trim()) + ')';
      });
      // Plain markdown links to .md / images with spaces or CJK — encode path only
      content = content.replace(/\]\(([^)#]+)(#[^)]*)?\)/g, function (m, path, hash) {
        if (/^(https?:|mailto:|\/\/|#)/i.test(path)) return m;
        try {
          var decoded = decodeURI(path);
          var enc = encodeURI(decoded);
          return '](' + enc + (hash || '') + ')';
        } catch (e) {
          return m;
        }
      });
      return content;
    }

    window.$docsify = {
      name: 'RouterOS 入门实战',
      repo: 'gygy/routeros-starter-guide',
      homepage: 'README.md',
      loadSidebar: true,
      autoHeader: false,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      mergeNavbar: true,
      search: {
        placeholder: '搜索课文 / Search',
        noData: '没有结果 / No results',
        depth: 3,
        pathNamespaces: ['/', '/en/']
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (content) {
            return fixMdLinks(content);
          });
          hook.doneEach(function () {
            var path = (vm.route.path || '/').toLowerCase();
            var zh = document.getElementById('lang-zh');
            var en = document.getElementById('lang-en');
            if (!zh || !en) return;
            var isEn = path.indexOf('/en/') === 0 || path === '/en/readme';
            zh.classList.toggle('active', !isEn);
            en.classList.toggle('active', isEn);
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
